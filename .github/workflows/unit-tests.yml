name: unit-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: extension validation suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Strict GSettings schema compilation check
        run: |
          shopt -s nullglob
          found=0
          for dir in extensions/*/schemas/; do
            found=1
            echo "Checking schema in $dir"
            glib-compile-schemas --strict --dry-run "$dir"
          done
          if [ "$found" -eq 0 ]; then
            echo "No extension schemas found to compile."
          fi
