name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Extension Validation Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GLib schema compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run discovery test suite
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Check JavaScript syntax
        run: find extensions -name "*.js" -exec node --check {} +

      - name: Compile GSettings schemas (strict dry-run)
        run: |
          shopt -s nullglob
          schemas=(extensions/*/schemas/)
          if [ ${#schemas[@]} -eq 0 ]; then
            echo "No extension schemas found to compile."
          else
            for dir in "${schemas[@]}"; do
              echo "Validating schema compilation in $dir"
              glib-compile-schemas --strict --dry-run "$dir"
            done
          fi
