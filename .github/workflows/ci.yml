name: ci

# Enforces the validation contract that docs/skills/extension-validation.md and
# AGENTS.md describe but previously left to run by hand. Without this, a PR could
# merge with failing tests, malformed metadata.json, undeclared GSettings keys, or
# non-ESM sources and GNOME Shell would only refuse to load it at runtime.
on:
  push:
    branches: [main]
  pull_request:
  # The `main` ruleset runs a merge queue. The queue builds a temporary
  # `merge_group` ref and waits for the required `validate extensions` context
  # to report against it. Without this trigger no run is ever started, the
  # context never reports, and every queued PR sits in AWAITING_CHECKS until
  # check_response_timeout_minutes expires and the entry is dropped.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Safe for merge_group: each queue entry gets its own temporary ref, so this
  # only cancels a run whose SHA the queue has already superseded.
  cancel-in-progress: true

jobs:
  extension-validation:
    name: validate extensions (tests, node --check, glib-compile-schemas)
    runs-on: ubuntu-latest
    # Bound all subprocess-based behavioral checks so a hung runtime cannot
    # hold the required `validate extensions` context — and its merge queue
    # entry — for GitHub's 360-minute default.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The unittest suite runs `node --check` over every JS source and skips the
      # check only when node is absent. Set up node so the gate actually runs.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # Exercise both Node desktop harnesses and the standalone real-GJS helper.
      # Ubuntu's Podman package supplies the real Quadlet generator; dry-run
      # generation does not start containers or require an active user manager.
      - name: Install validation runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gjs xdg-user-dirs podman coreutils systemd
          for tool in realpath id sh timeout systemctl; do
            test -x "/usr/bin/$tool"
          done
          # Fail rather than silently skip the helper or generator scenarios.
          python3 -c 'import sys; sys.path.insert(0, "tests"); import test_syncthing_service_behavior as t; assert t.GJS, "GJS missing"; assert t.GENERATOR, "Quadlet generator missing"'

      # stdlib unittest runner — no Python dependencies. Includes real-GJS helper
      # behavior alongside metadata, schemas, ESM sources and teardown hygiene.
      - name: Run validation suite
        run: python3 -m unittest discover -s tests -t tests -v

      # Compile every extension's schemas strictly. The suite already checks that
      # schema keys are used by sources; this catches real compile errors.
      - name: Compile GSettings schemas strictly
        run: |
          shopt -s nullglob
          found=0
          for dir in extensions/*/schemas/; do
            found=1
            echo "::group::glib-compile-schemas --strict $dir"
            glib-compile-schemas --strict --dry-run "$dir"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no extension ships schemas/; nothing to compile"
          fi
