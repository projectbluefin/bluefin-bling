name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-validation:
    name: extension manifest, schema and source validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (for node --check)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin

      - name: Run extension validation suite
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Compile GSettings schemas strictly
        run: |
          shopt -s nullglob
          found=0
          for dir in extensions/*/schemas/; do
            found=1
            echo "::group::glib-compile-schemas --strict $dir"
            glib-compile-schemas --strict --dry-run "$dir"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no extension ships schemas/; nothing to compile"
          fi
